<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecabricks 3Dデモ - Cat</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #f0f3f5; display: flex; justify-content: center; align-items: center; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <model-viewer 
        src="Cat.glb" 
        alt="Mecabricks Cat モデル"
        auto-rotate
        rotation-per-second="12deg"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1.2"
        max-camera-orbit="auto auto 10000%"
        camera-orbit="0deg 75deg 5000%">
    </model-viewer>

</body>
</html>
